<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hostel API (Express)</title>
<style>
  :root { --bg:#1f1308; --card:#2a1a0c; --accent:#fb923c; --text:#fef3c7; --muted:#fbbf24; --danger:#f87171; --ok:#fde68a; }
  * { box-sizing:border-box; font-family: system-ui, sans-serif; }
  body { margin:0; background:var(--bg); color:var(--text); min-height:100vh; }
  nav.topbar { background:var(--card); padding:14px 24px; display:flex; gap:18px; border-bottom:1px solid #3b2410; }
  nav.topbar a { color:var(--text); font-weight:600; cursor:pointer; }
  nav.topbar a.active { color:var(--accent); }
  .container { max-width:960px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 4px 12px rgba(0,0,0,.4); }
  h1,h2 { color:var(--accent); }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); flex:1; min-width:160px; }
  input, select { padding:8px 10px; border-radius:6px; border:1px solid #3b2410; background:#120a04; color:var(--text); margin-top:4px; }
  button { padding:8px 14px; border:none; border-radius:6px; background:var(--accent); color:#120a04; font-weight:600; cursor:pointer; }
  button.secondary { background:#3b2410; color:var(--text); }
  button.danger { background:var(--danger); color:#fff; }
  .msg { margin-top:8px; font-size:14px; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:var(--ok); }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:8px 10px; border-bottom:1px solid #3b2410; text-align:left; }
  th { color:var(--accent); }
  .badge { padding:2px 8px; border-radius:999px; font-size:12px; }
  .badge.active { background:#7c2d12; color:var(--ok); }
  .badge.inactive { background:#7f1d1d; color:var(--danger); }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .view { display:none; }
  .view.active { display:block; }
  .stat { font-size:28px; font-weight:700; color:var(--accent); }
  code { background:#120a04; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
  <nav class="topbar">
    <a data-view="home" class="active">Home</a>
    <a data-view="login">Login</a>
    <a data-view="list">List</a>
    <a data-view="add">Add</a>
    <a data-view="protected">Protected</a>
  </nav>
  <div class="container">
    <div id="home" class="view active">
      <div class="card">
        <h1>Hostel REST API (Express.js)</h1>
        <p>CRUD routes, logging middleware, validation, centralized errors, JWT-protected route, bcrypt passwords.</p>
        <div class="row">
          <div class="card" style="flex:1;min-width:160px;text-align:center"><div class="stat" id="statTotal">0</div><div>Total</div></div>
          <div class="card" style="flex:1;min-width:160px;text-align:center"><div class="stat" id="statActive">0</div><div>Active</div></div>
        </div>
      </div>
    </div>
    <div id="login" class="view">
      <div class="card">
        <h2>Login (JWT)</h2>
        <label>Username <input id="username" value="admin" /></label>
        <label>Password <input id="password" type="password" value="admin123" /></label>
        <div style="margin-top:12px"><button id="loginBtn">Login</button></div>
        <div id="loginMsg" class="msg"></div>
        <p style="font-size:12px;color:var(--muted)">Default: admin / admin123</p>
      </div>
    </div>
    <div id="list" class="view">
      <div class="card">
        <div class="toolbar"><button id="loadBtn">GET /api/residents</button><input id="search" placeholder="Search..." style="flex:0;min-width:200px" /></div>
        <div id="loadMsg" class="msg"></div>
        <table><thead><tr><th>Name</th><th>Roll</th><th>Room</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table>
      </div>
    </div>
    <div id="add" class="view">
      <div class="card">
        <h2>Add Resident (POST)</h2>
        <div class="row">
          <label>Name <input id="name" /></label>
          <label>Roll <input id="roll" type="number" /></label>
          <label>Room <input id="room" /></label>
          <label>Status <select id="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></label>
        </div>
        <div style="margin-top:12px"><button id="addBtn">POST</button></div>
        <div id="formMsg" class="msg"></div>
      </div>
    </div>
    <div id="protected" class="view">
      <div class="card">
        <h2>Protected Route (JWT)</h2>
        <button id="protBtn">GET /api/protected</button>
        <div id="protMsg" class="msg"></div>
        <pre id="protOut" style="background:#120a04;padding:10px;border-radius:6px;margin-top:8px;overflow:auto"></pre>
      </div>
    </div>
  </div>
<script>
const base="";
let residents=[], token=null;
function showMsg(el,t,ok=true){ el.textContent=t; el.className="msg "+(ok?"ok":"err"); }
function switchView(v){ document.querySelectorAll(".view").forEach(x=>x.classList.remove("active")); document.getElementById(v).classList.add("active"); document.querySelectorAll("nav.topbar a").forEach(a=>a.classList.toggle("active",a.dataset.view===v)); if(v==="list") load(); if(v==="home") updateStats(); }
document.querySelectorAll("nav.topbar a").forEach(a=>a.addEventListener("click",()=>switchView(a.dataset.view)));
async function load(){ try{const res=await fetch(base+"/api/residents"); if(!res.ok) throw new Error("HTTP "+res.status); residents=await res.json(); render(); showMsg(document.getElementById("loadMsg"),`Loaded ${residents.length} records.`,true); updateStats();}catch(e){showMsg(document.getElementById("loadMsg"),"Failed: "+e.message,false);} }
function render(){ const q=document.getElementById("search").value.toLowerCase(); let list=[...residents]; if(q) list=list.filter(r=>r.name.toLowerCase().includes(q)||r.room.toLowerCase().includes(q)); const tb=document.getElementById("tbody"); tb.innerHTML=""; list.forEach(r=>{const tr=document.createElement("tr"); tr.innerHTML=`<td>${r.name}</td><td>${r.roll}</td><td>${r.room}</td><td><span class="badge ${r.status}">${r.status}</span></td><td><button class="secondary" data-act="toggle" data-id="${r.id}">Toggle</button> <button class="danger" data-act="del" data-id="${r.id}">Delete</button></td>`; tb.appendChild(tr);}); }
function updateStats(){ fetch(base+"/api/residents").then(r=>r.json()).then(d=>{document.getElementById("statTotal").textContent=d.length; document.getElementById("statActive").textContent=d.filter(x=>x.status==="active").length;}).catch(()=>{}); }
document.getElementById("loginBtn").addEventListener("click", async ()=>{ const username=document.getElementById("username").value; const password=document.getElementById("password").value; const res=await fetch(base+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})}); const data=await res.json(); const lm=document.getElementById("loginMsg"); if(res.ok){token=data.token; showMsg(lm,"Logged in. Token stored.",true);} else showMsg(lm,data.error||"Login failed",false); });
document.getElementById("addBtn").addEventListener("click", async ()=>{ const name=document.getElementById("name").value.trim(); const roll=document.getElementById("roll").value.trim(); const room=document.getElementById("room").value.trim(); const status=document.getElementById("status").value; const fm=document.getElementById("formMsg"); if(!name||!roll||!room){showMsg(fm,"All fields required.",false);return;} const res=await fetch(base+"/api/residents",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,roll,room,status})}); const data=await res.json(); if(res.ok){showMsg(fm,"Created (POST).",true); document.getElementById("name").value="";document.getElementById("roll").value="";document.getElementById("room").value=""; await load();} else showMsg(fm,data.error||"Failed",false); });
document.getElementById("tbody").addEventListener("click", async e=>{ const btn=e.target.closest("button"); if(!btn) return; const id=Number(btn.dataset.id); if(btn.dataset.act==="del"){ await fetch(base+"/api/residents/"+id,{method:"DELETE"}); await load(); } else if(btn.dataset.act==="toggle"){ const r=residents.find(x=>x.id===id); if(r){ await fetch(base+"/api/residents/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:r.name,roll:r.roll,room:r.room,status:r.status==="active"?"inactive":"active"})}); await load(); } } });
document.getElementById("loadBtn").addEventListener("click", load);
document.getElementById("search").addEventListener("input", render);
document.getElementById("protBtn").addEventListener("click", async ()=>{ const res=await fetch(base+"/api/protected",{headers: token?{Authorization:"Bearer "+token}:{}}); const data=await res.json(); document.getElementById("protOut").textContent=JSON.stringify(data,null,2); showMsg(document.getElementById("protMsg"), res.ok?"OK":"Unauthorized", res.ok); });
load(); updateStats();
</script>
</body>
</html>
