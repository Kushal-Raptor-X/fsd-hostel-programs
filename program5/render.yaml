services:
  - type: web
    name: hostel-backend
    runtime: node
    plan: free
    rootDir: program5/backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/residents
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
databases:
  - name: hostel-db
    plan: free
    databaseName: hostel
    user: hostel
