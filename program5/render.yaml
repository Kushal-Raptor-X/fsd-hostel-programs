services:
  - type: web
    name: hostel-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
databases:
  - name: hostel-db
    plan: free
    databaseName: hostel
    user: hostel
